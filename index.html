<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina 3D: V-Sign Text System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&display=swap');
        body { margin: 0; overflow: hidden; background-color: #020205; font-family: 'Plus Jakarta Sans', sans-serif; color: white; }
        canvas { display: block; filter: contrast(1.1) brightness(1.1); }
        .glass {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .active-pattern {
            background: rgba(59, 130, 246, 0.5) !important;
            border-color: #3b82f6 !important;
        }
        #output-canvas {
            transform: scaleX(-1);
            border-radius: 12px;
            width: 140px;
            height: 105px;
            object-fit: cover;
            border: 2px solid rgba(0, 242, 255, 0.3);
        }
        .v-sign-glow {
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #00f2ff; }
            to { text-shadow: 0 0 10px #fff, 0 0 20px #00f2ff; }
        }
    </style>
</head>
<body>

    <div class="fixed inset-0 pointer-events-none flex flex-col justify-between p-8 z-10">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="space-y-1">
                <h1 class="text-3xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-yellow-500">LUMINA PROJECT</h1>
                <div class="flex items-center gap-2">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-cyan-500"></div>
                    <p id="status-text" class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Sistem Siap...</p>
                </div>
            </div>
            <button id="fullscreen-btn" class="glass p-4 rounded-2xl hover:bg-white/5 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
        </div>

        <div id="tutorial" class="self-center glass px-6 py-3 rounded-full text-xs text-cyan-200">
            Gunakan <span class="font-bold text-yellow-400 uppercase">V-Sign</span> untuk pesan rahasia
        </div>

        <div class="flex flex-col md:flex-row gap-8 items-end justify-between pointer-events-auto">
            <div class="glass p-4 rounded-3xl flex flex-col gap-3">
                <div class="relative">
                    <video id="video-preview" class="hidden"></video>
                    <canvas id="output-canvas"></canvas>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] text-gray-500 uppercase font-bold">
                        <span>Deteksi Gestur</span>
                        <span id="hand-label" class="text-cyan-500">Mencari...</span>
                    </div>
                    <div id="gesture-result" class="text-sm font-bold text-cyan-400 h-5 transition-all uppercase">---</div>
                </div>
            </div>

            <div class="glass p-8 rounded-[2rem] w-full max-w-md space-y-6">
                <div class="space-y-4">
                    <label class="text-[10px] uppercase tracking-[0.2em] text-gray-500">Kontrol Manual</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setPattern('sphere')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5 active-pattern" id="btn-sphere">Sphere</button>
                        <button onclick="setPattern('torus')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5" id="btn-torus">Torus</button>
                        <button onclick="setPattern('heart')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5" id="btn-heart">Heart</button>
                        <button onclick="setPattern('star')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5" id="btn-star">Star</button>
                        <button onclick="setPattern('dna')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5" id="btn-dna">DNA</button>
                        <button onclick="setPattern('chaos')" class="pattern-btn glass py-3 rounded-xl text-xs hover:bg-white/5" id="btn-chaos">Chaos</button>
                    </div>
                </div>
                <div class="flex items-center justify-between border-t border-white/5 pt-4">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-[0.2em] text-gray-500 block">Warna Utama</label>
                        <input type="color" id="particle-color" value="#00f2ff" class="w-16 h-8 bg-transparent cursor-pointer">
                    </div>
                    <div id="v-sign-status" class="hidden flex items-center gap-2 bg-yellow-500/20 px-3 py-1 rounded-full border border-yellow-500/50">
                        <span class="text-[9px] font-bold text-yellow-500 uppercase">V-Sign Detected!</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry, material;
        let positions, targetPositions, colors;
        
        let currentScale = 1.0;
        let targetScale = 1.0;
        let targetRotX = 0, targetRotY = 0;
        let lerpFactor = 0.12;
        let isVSignActive = false;
        let lastPatternBeforeV = 'sphere';

        let video, outCanvas, outCtx;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 7;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            positions = new Float32Array(PARTICLE_COUNT * 3);
            targetPositions = new Float32Array(PARTICLE_COUNT * 3);
            colors = new Float32Array(PARTICLE_COUNT * 3);

            const baseColor = new THREE.Color(0x00f2ff);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 20;
                positions[i3+1] = (Math.random() - 0.5) * 20;
                positions[i3+2] = (Math.random() - 0.5) * 20;
                colors[i3] = baseColor.r; colors[i3+1] = baseColor.g; colors[i3+2] = baseColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            setPattern('sphere');
        }

        function generateTextPositions(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1000;
            canvas.height = 200;
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 500, 100);

            const imageData = ctx.getImageData(0, 0, 1000, 200).data;
            const points = [];
            
            for (let y = 0; y < 200; y += 2) {
                for (let x = 0; x < 1000; x += 2) {
                    const alpha = imageData[(y * 1000 + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({
                            x: (x - 500) * 0.012,
                            y: (100 - y) * 0.012,
                            z: (Math.random() - 0.5) * 0.1
                        });
                    }
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = points[i % points.length];
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }

        function setPattern(type) {
            if (type === 'text') {
                generateTextPositions("You Are Monkey");
                return;
            }

            lastPatternBeforeV = type;
            document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active-pattern'));
            const targetBtn = document.getElementById(`btn-${type}`);
            if (targetBtn) targetBtn.classList.add('active-pattern');

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                let x, y, z;
                if (type === 'sphere') {
                    const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                    const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                    x = 2.5 * Math.cos(theta) * Math.sin(phi);
                    y = 2.5 * Math.sin(theta) * Math.sin(phi);
                    z = 2.5 * Math.cos(phi);
                } else if (type === 'torus') {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    x = (2.2 + 0.6 * Math.cos(v)) * Math.cos(u);
                    y = (2.2 + 0.6 * Math.cos(v)) * Math.sin(u);
                    z = 0.6 * Math.sin(v);
                } else if (type === 'heart') {
                    const t = Math.random() * Math.PI * 2;
                    x = 0.18 * (16 * Math.pow(Math.sin(t), 3));
                    y = 0.18 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    z = (Math.random() - 0.5) * 0.8;
                } else if (type === 'star') {
                    const angle = Math.random() * Math.PI * 2;
                    const r = (i % 2 === 0 ? 3 : 1.2) * Math.random();
                    x = r * Math.cos(angle);
                    y = r * Math.sin(angle);
                    z = (Math.random() - 0.5) * 0.5;
                } else if (type === 'dna') {
                    const t = (i / PARTICLE_COUNT) * Math.PI * 10;
                    const side = i % 2 === 0 ? 1 : -1;
                    x = Math.cos(t) * side;
                    y = (i / PARTICLE_COUNT - 0.5) * 8;
                    z = Math.sin(t) * side;
                } else {
                    x = (Math.random() - 0.5) * 10;
                    y = (Math.random() - 0.5) * 10;
                    z = (Math.random() - 0.5) * 10;
                }
                targetPositions[i3] = x;
                targetPositions[i3+1] = y;
                targetPositions[i3+2] = z;
            }
        }

        function initLocalAI() {
            video = document.getElementById('video-preview');
            outCanvas = document.getElementById('output-canvas');
            outCtx = outCanvas.getContext('2d');
            outCanvas.width = 140;
            outCanvas.height = 105;

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onResults);

            const cam = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 320, height: 240
            });
            cam.start();
            document.getElementById('status-text').innerText = "V-SIGN ENGINE AKTIF";
        }

        function onResults(results) {
            outCtx.save();
            outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
            outCtx.drawImage(results.image, 0, 0, outCanvas.width, outCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const center = landmarks[9];
                targetRotY = (center.x - 0.5) * 3; 
                targetRotX = (center.y - 0.5) * 3;

                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];

                const isIndexExtended = indexTip.y < landmarks[6].y;
                const isMiddleExtended = middleTip.y < landmarks[10].y;
                const isRingClosed = ringTip.y > landmarks[14].y;
                const isPinkyClosed = pinkyTip.y > landmarks[18].y;

                if (isIndexExtended && isMiddleExtended && isRingClosed && isPinkyClosed) {
                    if (!isVSignActive) {
                        isVSignActive = true;
                        setPattern('text');
                        document.getElementById('v-sign-status').classList.remove('hidden');
                    }
                    targetScale = 1.8;
                    document.getElementById('gesture-result').innerText = "PEACE / V-SIGN";
                    document.getElementById('gesture-result').className = "text-sm font-bold text-yellow-400";
                } else {
                    if (isVSignActive) {
                        isVSignActive = false;
                        setPattern(lastPatternBeforeV);
                        document.getElementById('v-sign-status').classList.add('hidden');
                    }
                    
                    let extendedCount = 0;
                    [8,12,16,20].forEach(id => { if(landmarks[id].y < landmarks[id-2].y) extendedCount++; });

                    if (extendedCount >= 3) {
                        targetScale = 2.8;
                        document.getElementById('gesture-result').innerText = "TERBUKA";
                        document.getElementById('gesture-result').className = "text-sm font-bold text-cyan-400";
                    } else {
                        targetScale = 0.4;
                        document.getElementById('gesture-result').innerText = "MENGEPAL";
                        document.getElementById('gesture-result').className = "text-sm font-bold text-red-400";
                    }
                }
            } else {
                targetScale = 1.0;
                document.getElementById('gesture-result').innerText = "MENCARI TANGAN...";
            }
            outCtx.restore();
        }

        function animate() {
            requestAnimationFrame(animate);
            currentScale += (targetScale - currentScale) * 0.1;
            particles.rotation.x += (targetRotX - particles.rotation.x) * 0.1;
            particles.rotation.y += (targetRotY - particles.rotation.y) * 0.1;

            const pos = geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const tx = targetPositions[i3] * currentScale;
                const ty = targetPositions[i3+1] * currentScale;
                const tz = targetPositions[i3+2] * currentScale;
                pos[i3] += (tx - pos[i3]) * 0.15;
                pos[i3+1] += (ty - pos[i3+1]) * 0.15;
                pos[i3+2] += (tz - pos[i3+2]) * 0.15;
            }
            geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
        }

        document.getElementById('particle-color').addEventListener('input', (e) => {
            const c = new THREE.Color(e.target.value);
            const colorsAttr = geometry.attributes.color;
            for(let i=0; i<PARTICLE_COUNT; i++) colorsAttr.setXYZ(i, c.r, c.g, c.b);
            colorsAttr.needsUpdate = true;
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        window.onload = () => { initThree(); initLocalAI(); animate(); };
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
